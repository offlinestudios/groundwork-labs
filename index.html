<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --ink:#131a17;
  --ink-soft:#3c4643;
  --muted:#5b6663;
  --muted-2:#7d8884;
  --faint:#9aa5a1;
  --on-dark:#d9dfdc;

  --page:#f6f8f7;
  --canvas:#eef1f0;
  --canvas-2:#f0f2f1;
  --white:#fff;

  --border:#e2e7e5;
  --border-strong:#cfd7d4;
  --divider-dark:#2a332f;

  --green:#1f8a5b;
  --green-hover:#14603f;
  --green-light:#5ec698;
  --green-tint:#e7f3ed;
  --green-bar-soft:#9fc4b3;
  --numeral:#d3ddd8;
  --disabled:#b6bfbb;

  --danger-bg:#fbeaea;
  --danger-fg:#a33b3b;

  --shadow-hero:0 24px 60px -24px rgba(19,26,23,0.45);
  --shadow-lift:0 12px 32px -16px rgba(19,26,23,0.25);
  --shadow-card:0 20px 48px -28px rgba(19,26,23,0.25);
  --shadow-card-sm:0 16px 40px -28px rgba(19,26,23,0.30);

  --maxw:1160px;
  --pad-x:32px;
}

/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--canvas);
  font-family:'Geologica',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
a{color:var(--green);text-decoration:none;}
a:hover{color:var(--green-hover);}
img,svg{display:block;}
button{font:inherit;}
::placeholder{color:var(--faint);opacity:1;}
h1,h2,h3,p{margin:0;}

:focus-visible{
  outline:2px solid var(--green);
  outline-offset:3px;
  border-radius:4px;
}

.app{min-height:100vh;display:flex;flex-direction:column;}
.screen{flex:1;background:var(--white);display:flex;flex-direction:column;}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

/* ============================================================
   LAYOUT PRIMITIVES
   ============================================================ */
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:var(--pad-x);padding-right:var(--pad-x);}
.wrap-narrow{max-width:900px;margin:0 auto;padding-left:var(--pad-x);padding-right:var(--pad-x);}
.wrap-faq{max-width:760px;margin:0 auto;padding-left:var(--pad-x);padding-right:var(--pad-x);}
.wrap-dash{max-width:1100px;margin:0 auto;}

.rule-b{border-bottom:1px solid var(--canvas);}
.rule-t{border-top:1px solid var(--canvas);}

/* ============================================================
   TYPE
   ============================================================ */
.eyebrow{
  font-size:13px;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--green);font-weight:600;
}
.eyebrow-quiet{
  font-size:12px;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--muted-2);font-weight:500;
}
.h1{font-size:56px;line-height:1.06;font-weight:600;letter-spacing:-0.025em;text-wrap:pretty;}
.h1-center{font-size:52px;line-height:1.08;font-weight:600;letter-spacing:-0.025em;text-wrap:pretty;}
.h2{font-size:36px;font-weight:600;letter-spacing:-0.02em;text-wrap:pretty;}
.h2-sm{font-size:34px;font-weight:600;letter-spacing:-0.02em;text-wrap:pretty;}
.h2-lg{font-size:38px;font-weight:600;letter-spacing:-0.02em;text-wrap:pretty;}
.lede{font-size:17px;line-height:1.55;color:var(--muted);font-weight:300;text-wrap:pretty;}
.body{font-size:16px;line-height:1.6;color:var(--muted);font-weight:300;text-wrap:pretty;}
.body-sm{font-size:15px;line-height:1.55;color:var(--muted);font-weight:300;}
.micro{font-size:14px;color:var(--muted-2);}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  border:none;border-radius:10px;font-weight:500;cursor:pointer;
  text-align:center;text-decoration:none;
  transition:background-color .15s ease,color .15s ease,border-color .15s ease;
}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-hover);color:#fff;}
.btn-outline{background:transparent;border:1px solid var(--border-strong);color:var(--ink);}
.btn-outline:hover{border-color:var(--green);color:var(--green);}
.btn-text{background:none;border:none;color:var(--ink-soft);font-size:14px;cursor:pointer;padding:6px 2px;}
.btn-text:hover{color:var(--green);}

.btn-nav{border-radius:9px;padding:11px 20px;font-size:14px;}
.btn-hero{padding:15px 28px;font-size:16px;}
.btn-hero-outline{padding:14px 26px;font-size:16px;}
.btn-lg{padding:16px 32px;font-size:16px;}
.btn-xl{padding:16px 32px;font-size:17px;}
.btn-xxl{padding:17px 36px;font-size:17px;}

/* ============================================================
   BRAND
   ============================================================ */
.brand{display:flex;align-items:center;gap:10px;}
.brand-link{background:none;border:none;padding:0;cursor:pointer;color:inherit;display:flex;align-items:center;gap:10px;}
.wordmark{font-weight:600;font-size:18px;letter-spacing:-0.01em;color:var(--ink);}
.wordmark .labs{color:var(--green);font-weight:400;}
.crumb-sep{color:var(--disabled);font-size:17px;}
.crumb{font-size:17px;color:var(--muted);}

/* ============================================================
   SITE NAV
   ============================================================ */
.nav{
  border-bottom:1px solid var(--border);background:var(--white);
  position:sticky;top:0;z-index:40;
}
.nav-inner{
  max-width:var(--maxw);margin:0 auto;padding:0 var(--pad-x);height:68px;
  display:flex;align-items:center;justify-content:space-between;
}
.nav-left{display:flex;align-items:center;gap:36px;}
.nav-links{display:flex;gap:26px;font-size:14px;}
.nav-links a{color:var(--ink-soft);}
.nav-links a:hover{color:var(--green);}
.nav-right{display:flex;align-items:center;gap:14px;}
.nav-burger{display:none;}
.nav-menu{display:none;}

/* ============================================================
   HOME — HERO
   ============================================================ */
.hero{background:linear-gradient(180deg,var(--page) 0%,var(--white) 100%);border-bottom:1px solid var(--canvas);}
.hero-inner{
  padding-top:88px;padding-bottom:72px;
  display:grid;grid-template-columns:1.1fr 0.9fr;gap:72px;align-items:center;
}
.hero-eyebrow{margin-bottom:18px;}
.hero-h1{margin-bottom:22px;}
.hero-copy{font-size:19px;line-height:1.55;color:var(--muted);font-weight:300;max-width:520px;margin-bottom:34px;text-wrap:pretty;}
.hero-actions{display:flex;align-items:center;gap:16px;}
.hero-micro{margin-top:20px;font-size:14px;color:var(--muted-2);}

.metric-card{
  background:var(--ink);border-radius:18px;padding:34px;color:var(--on-dark);
  box-shadow:var(--shadow-hero);
}
.metric-card .eyebrow-quiet{margin-bottom:24px;}
.metric-rows{display:flex;flex-direction:column;gap:18px;}
.metric-row{
  display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid var(--divider-dark);padding-bottom:16px;
}
.metric-row:last-child{border-bottom:none;padding-bottom:0;}
.metric-label{font-size:14px;font-weight:300;}
.metric-value{font-size:22px;font-weight:600;color:var(--green-light);}
.metric-note{margin-top:26px;font-size:13px;line-height:1.5;color:var(--muted-2);}

/* ============================================================
   HOME — TRUST STRIP
   ============================================================ */
.trust{border-bottom:1px solid var(--canvas);background:var(--white);}
.trust-inner{
  padding-top:26px;padding-bottom:26px;
  display:flex;align-items:center;justify-content:center;gap:48px;flex-wrap:wrap;
  color:var(--faint);font-size:14px;font-weight:500;letter-spacing:0.02em;
}

/* ============================================================
   HOME — PROBLEMS
   ============================================================ */
.problems{background:var(--page);}
.problems-inner{padding-top:80px;padding-bottom:88px;}
.section-head{max-width:560px;margin-bottom:44px;}
.section-head .h2{margin-bottom:14px;}
.problem-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.problem-card{
  background:var(--white);border:1px solid var(--border);border-radius:14px;padding:26px;
  display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;
  font:inherit;color:inherit;
  transition:box-shadow .15s ease,transform .15s ease;
}
.problem-card:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px);}
.problem-slug{font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--green);font-weight:600;}
.problem-hook{font-size:17px;line-height:1.4;font-weight:500;letter-spacing:-0.005em;flex:1;text-wrap:pretty;color:var(--ink);}
.problem-cta{font-size:14px;color:var(--green);font-weight:500;}

/* ============================================================
   HOME — HOW IT WORKS
   ============================================================ */
.how{background:var(--white);border-top:1px solid var(--canvas);}
.how-inner{padding-top:80px;padding-bottom:88px;}
.how-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;}
.how-step{display:flex;flex-direction:column;gap:12px;}
.how-num{font-size:44px;font-weight:600;color:var(--numeral);letter-spacing:-0.03em;line-height:1;}
.how-step h3{font-size:19px;font-weight:600;}

/* ============================================================
   HOME — RESULTS BAND
   ============================================================ */
.results{background:var(--ink);color:#fff;}
.results-inner{
  padding-top:72px;padding-bottom:72px;
  display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;
}
.results-copy{font-size:16px;line-height:1.6;color:var(--faint);font-weight:300;text-wrap:pretty;}
.results-inner .h2-sm{margin-bottom:16px;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;text-align:center;}
.stat-value{font-size:38px;font-weight:600;color:var(--green-light);line-height:1.1;}
.stat-value .unit{font-size:22px;}
.stat-label{font-size:13px;color:var(--faint);margin-top:6px;}

/* ============================================================
   FINAL CTA (light)
   ============================================================ */
.cta-light{background:var(--white);}
.cta-light-inner{padding-top:80px;padding-bottom:80px;text-align:center;}
.cta-light-inner .h2-sm{margin-bottom:14px;}
.cta-light-inner .lede{margin-bottom:30px;}

/* ============================================================
   FOOTER (site)
   ============================================================ */
.footer{border-top:1px solid var(--border);background:var(--page);}
.footer-inner{
  padding-top:48px;padding-bottom:48px;
  display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px;font-size:14px;
}
.footer-brand{display:flex;flex-direction:column;gap:12px;}
.footer-brand .wordmark{font-size:16px;}
.footer-tag{color:var(--muted-2);line-height:1.5;font-weight:300;}
.footer-col{display:flex;flex-direction:column;gap:10px;}
.footer-col-head{font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted-2);}
.footer-col a{color:var(--ink-soft);}
.footer-col a:hover{color:var(--green);}
.footer-legal{border-top:1px solid var(--border);padding:18px var(--pad-x);text-align:center;font-size:13px;color:var(--faint);}

/* ============================================================
   FUNNEL PAGE
   ============================================================ */
.fnav-brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:none;padding:0;}
.fnav-brand .wordmark{font-size:17px;}

.fhero{background:linear-gradient(180deg,var(--page) 0%,var(--white) 100%);border-bottom:1px solid var(--canvas);}
.fhero-inner{padding-top:88px;padding-bottom:64px;text-align:center;}
.fhero-inner .h1-center{margin-bottom:22px;}
.fhero-copy{
  font-size:19px;line-height:1.6;color:var(--muted);font-weight:300;
  max-width:620px;margin:0 auto 34px;text-wrap:pretty;
}
.fhero-micro{margin-top:18px;font-size:14px;color:var(--muted-2);}

.agitate{border-bottom:1px solid var(--canvas);background:var(--white);}
.agitate-inner{padding-top:72px;padding-bottom:72px;display:grid;grid-template-columns:repeat(3,1fr);gap:32px;}
.agitate-item{display:flex;flex-direction:column;gap:10px;}
.agitate-item h3{font-size:18px;font-weight:600;text-wrap:pretty;}

.mech{background:var(--page);border-bottom:1px solid var(--canvas);}
.mech-inner{padding-top:80px;padding-bottom:80px;display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;}
.mech-inner .eyebrow{display:block;margin-bottom:14px;}
.mech-inner .h2-sm{margin-bottom:18px;}
.mech-steps{display:flex;flex-direction:column;gap:18px;font-size:16px;line-height:1.55;color:var(--ink-soft);}
.mech-step{display:flex;gap:14px;}
.mech-step-n{color:var(--green);font-weight:600;}
.mech-step-t{font-weight:300;}

.change-card{
  background:var(--white);border:1px solid var(--border);border-radius:16px;padding:32px;
  box-shadow:var(--shadow-card);
}
.change-card .eyebrow-quiet{margin-bottom:24px;}
.change-rows{display:flex;flex-direction:column;gap:20px;}
.change-head{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px;}
.change-head .k{color:var(--muted);}
.change-head .v{font-weight:600;}
.change-head .v.is-after{color:var(--green);}
.change-track{height:12px;background:var(--canvas);border-radius:6px;overflow:hidden;}
.change-fill{height:12px;border-radius:6px;}
.change-fill.is-now{background:var(--disabled);}
.change-fill.is-after{background:var(--green);}
.change-sep{display:flex;align-items:center;gap:10px;color:var(--green);font-size:14px;font-weight:500;}
.change-sep .line{flex:1;height:1px;background:var(--border);}
.change-note{margin-top:24px;font-size:13px;line-height:1.5;color:var(--muted-2);}

.report{border-bottom:1px solid var(--canvas);background:var(--white);}
.report-inner{padding-top:80px;padding-bottom:80px;display:grid;grid-template-columns:0.9fr 1.1fr;gap:64px;align-items:center;}
.report-card{background:var(--ink);border-radius:16px;padding:30px;color:var(--on-dark);}
.report-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:16px;}
.report-card-head .who{font-size:12px;color:var(--muted-2);}
.report-rows{display:flex;flex-direction:column;gap:14px;font-size:14px;}
.report-row{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--divider-dark);padding-bottom:12px;}
.report-row:last-child{border-bottom:none;padding-bottom:0;}
.report-row .k{font-weight:300;}
.report-row .v{font-weight:600;}
.report-row .v.is-good{color:var(--green-light);}
.report-copy .eyebrow{display:block;margin-bottom:14px;}
.report-copy .h2-sm{margin-bottom:18px;}
.report-copy .body + .body{margin-top:16px;}

.faq{background:var(--page);border-bottom:1px solid var(--canvas);}
.faq-inner{padding-top:80px;padding-bottom:80px;}
.faq-inner .h2-sm{margin-bottom:36px;text-align:center;}
.faq-list{display:flex;flex-direction:column;gap:14px;}
.faq-item{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:22px 26px;}
.faq-item h3{font-size:16px;font-weight:600;margin-bottom:8px;}
.faq-item p{font-size:15px;line-height:1.6;color:var(--muted);font-weight:300;}

.cta-dark{background:var(--ink);color:#fff;}
.cta-dark-inner{padding-top:88px;padding-bottom:88px;text-align:center;}
.cta-dark-inner .h2-lg{margin-bottom:16px;}
.cta-dark-copy{font-size:17px;line-height:1.6;color:var(--faint);font-weight:300;margin-bottom:34px;text-wrap:pretty;}
.cta-dark-micro{margin-top:18px;font-size:14px;color:var(--muted-2);}


/* ============================================================
   SIGNUP
   ============================================================ */
.signup{
  flex:1;background:var(--page);display:flex;align-items:flex-start;justify-content:center;
  padding:72px var(--pad-x);
}
.signup-col{width:520px;max-width:100%;}
.signup-brand{
  display:flex;align-items:center;gap:10px;margin-bottom:28px;
  background:none;border:none;padding:0;cursor:pointer;color:inherit;
}
.signup-brand .wordmark{font-size:16px;}
.signup-brand .crumb-sep,.signup-brand .crumb{font-size:16px;}
.signup-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:36px;}
.signup-card h1{font-size:26px;font-weight:600;letter-spacing:-0.01em;margin-bottom:10px;}
.signup-card .body-sm{margin-bottom:28px;}
.form{display:flex;flex-direction:column;gap:18px;}
.field{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:500;color:var(--ink);}
.field input,.field select{
  border:1px solid var(--border-strong);border-radius:9px;padding:12px 14px;
  font:inherit;font-size:15px;font-weight:300;background:var(--white);color:var(--ink);
  transition:border-color .15s ease;
}
.field input:focus,.field select:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px rgba(31,138,91,0.12);}
.submit{
  border:none;border-radius:10px;padding:14px 24px;font-size:16px;font-weight:500;
  background:var(--disabled);color:#fff;cursor:not-allowed;
  transition:background-color .15s ease;
}
.submit.is-ready{background:var(--green);cursor:pointer;}
.submit.is-ready:hover{background:var(--green-hover);}
.form-micro{font-size:13px;color:var(--muted-2);text-align:center;}

.confirm-card{
  background:var(--white);border:1px solid var(--border);border-radius:16px;
  padding:44px 36px;text-align:center;
}
.confirm-check{
  width:52px;height:52px;border-radius:50%;background:var(--green-tint);color:var(--green);
  display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 20px;
}
.confirm-card h1{font-size:24px;font-weight:600;margin-bottom:12px;text-wrap:pretty;}
.confirm-card .body-sm{line-height:1.6;margin-bottom:28px;text-wrap:pretty;}
.next-panel{
  text-align:left;background:var(--page);border-radius:12px;padding:20px 24px;
  display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--ink);
}
.next-panel .eyebrow-quiet{font-size:12px;letter-spacing:0.06em;}

/* ============================================================
   DASHBOARD
   ============================================================ */
.dash{flex:1;background:var(--canvas-2);padding:40px var(--pad-x) 80px;}
.dash-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:8px;}
.dash-head h1{font-size:26px;font-weight:600;letter-spacing:-0.01em;}
.dash-meta{font-size:13px;color:var(--muted-2);}
.dash-sub{margin-bottom:32px;font-size:15px;color:var(--muted);font-weight:300;}

.table-card{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:24px;}
.trow{display:grid;grid-template-columns:1.4fr 0.7fr 0.7fr 0.9fr 0.7fr 0.9fr 1fr;align-items:center;}
.thead{
  padding:14px 24px;border-bottom:1px solid var(--border);
  font-size:12px;letter-spacing:0.05em;text-transform:uppercase;color:var(--muted-2);font-weight:500;
}
.tbody-row{padding:16px 24px;border-bottom:1px solid var(--canvas);font-size:15px;}
.tbody-row:last-child{border-bottom:none;}
.tbody-row .name{font-weight:500;}
.tbody-row .dim{color:var(--muted);}
.tbody-row .strong{font-weight:600;}
.badge{display:inline-block;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:0.03em;}
.badge-scale{background:var(--green-tint);color:var(--green-hover);}
.badge-continue{background:var(--canvas);color:var(--muted);}
.badge-kill{background:var(--danger-bg);color:var(--danger-fg);}

.dash-grid{display:grid;grid-template-columns:1.3fr 0.7fr;gap:24px;}
.ladder-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:28px;}
.ladder-card .eyebrow-quiet{margin-bottom:4px;letter-spacing:0.06em;}
.ladder-sub{margin-bottom:24px;font-size:14px;color:var(--muted);font-weight:300;}
.ladder-rows{display:flex;flex-direction:column;gap:14px;}

  document.addEventListener('click', function (e) {
    if (!e.target || typeof e.target.closest !== 'function') return;

    var copyEmail = e.target.closest('[data-copy-email]');
    if (copyEmail) {
      e.preventDefault();
      var email = copyEmail.getAttribute('data-copy-email');
      var status = document.querySelector('.contact-status');
      var setStatus = function (text) {
        if (status) status.textContent = text;
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(email).then(function () {
          setStatus('Email address copied.');
        }, function () {
          setStatus('Copy the email address shown above.');
        });
      } else {
        setStatus('Copy the email address shown above.');
      }
      return;
    }

    var scroller = e.target.closest('[data-scroll]');
    if (scroller) {
      e.preventDefault();
      var id = scroller.getAttribute('data-scroll');
      var wasOpen = state.menuOpen;
      state.menuOpen = false;
      if (document.getElementById(id)) {
        // Target is on the current page (in-page anchor or home section).
        if (wasOpen) render();
        scrollTo_(id);
      } else {
        // Section lives on the home page — go there first, then scroll.
        go('home');
        window.requestAnimationFrame(function () { scrollTo_(id); });
      }
      return;
    }

    var burger = e.target.closest('[data-menu]');
    if (burger) {
      state.menuOpen = !state.menuOpen;
      render();
      return;
    }

    var nav = e.target.closest('[data-go]');
    if (nav) {
      e.preventDefault();
      go(nav.getAttribute('data-go'), nav.getAttribute('data-funnel'));
      return;
    }
  });

  function scrollTo_(id) {
    var el = document.getElementById(id);
    if (!el) return;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var nav = document.querySelector('.nav');
    var offset = nav ? nav.getBoundingClientRect().height : 68;
    var top = el.getBoundingClientRect().top + window.pageYOffset - offset;
    window.scrollTo({ top: top, behavior: reduce ? 'auto' : 'smooth' });
  }

  document.addEventListener('input', function (e) {
    var name = e.target.name;
    if (name && Object.prototype.hasOwnProperty.call(state.form, name)) {
      state.form[name] = e.target.value;
      // Only the submit button's enabled state depends on this — patch in place
      // so the field keeps focus and the caret position.
      var btn = document.querySelector('.submit');
      if (btn) {
        var ready = state.form.businessName.trim() !== '' && state.form.email.trim() !== '';
        btn.classList.toggle('is-ready', ready);
        btn.disabled = !ready;
        btn.setAttribute('aria-disabled', ready ? 'false' : 'true');
      }
    }
  });

  document.addEventListener('change', function (e) {
    var name = e.target.name;
    if (name && Object.prototype.hasOwnProperty.call(state.form, name)) {
      state.form[name] = e.target.value;
    }
  });

  document.addEventListener('submit', function (e) {
    if (!e.target.classList.contains('form')) return;
    e.preventDefault();
    var ready = state.form.businessName.trim() !== '' && state.form.email.trim() !== '';
    if (!ready) return;
    if (typeof window.fbq === 'function') window.fbq('track', 'Lead');
    state.submitted = true;
    render();
    window.scrollTo(0, 0);
  });

  window.addEventListener('popstate', function () {
    readPath();
    render();
    window.scrollTo(0, 0);
  });

  /* ==========================================================
     BOOT
     ========================================================== */
  readPath();
  render();
})();
</script>
</body>
</html>
